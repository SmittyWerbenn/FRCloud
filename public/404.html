<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>FRCloud</title>
    <script>
      // GitHub Pages serves this for any path it doesn't recognize (i.e. every Vue Router
      // route except "/"). Redirect to "/" with the real path encoded in the query string,
      // then index.html's inline script below decodes it back via history.replaceState
      // before Vue Router initializes. Standard "spa-github-pages" trick.
      var pathSegmentsToKeep = 0
      var l = window.location
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      )
    </script>
  </head>
  <body></body>
</html>
