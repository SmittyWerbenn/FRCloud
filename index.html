<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FRCloud - Server Cepat & Handal</title>
    <meta name="description" content="FRCloud menyediakan layanan VPS, Dedicated Server, dan Cloud Hosting dengan performa tinggi dan harga terjangkau.">
    <script>
      // Decodes the redirect from public/404.html back into the real path, before Vue Router
      // initializes, so a direct link/refresh to e.g. /pricing lands on /pricing, not "/".
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
